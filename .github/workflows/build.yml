name: Build CarPlayDemo

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild -project CarPlayDemo.xcodeproj -target CarPlayDemo \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tee build-sim.log

      - name: Screenshot of the phone UI in Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/CarPlayDemo.app
          xcrun simctl launch "$DEVICE" ge.demo.carplaydemo
          sleep 15
          xcrun simctl io "$DEVICE" screenshot phone-screenshot.png

      - name: Build unsigned IPA (for sideloading)
        run: |
          set -o pipefail
          xcodebuild -project CarPlayDemo.xcodeproj -target CarPlayDemo \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build-device.log
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarPlayDemo.app Payload/
          zip -qr CarPlayDemo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: CarPlayDemo-build
          path: |
            CarPlayDemo-unsigned.ipa
            phone-screenshot.png
            build-sim.log
            build-device.log

      - name: Publish results to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp phone-screenshot.png /tmp/out/ 2>/dev/null || true
          { grep -hE "(warning|error):" build-sim.log build-device.log 2>/dev/null | grep -E "\.swift:" | sort -u; } > /tmp/out/diagnostics.txt || true
          grep -hE "BUILD (SUCCEEDED|FAILED)" build-sim.log build-device.log > /tmp/out/status.txt 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output
